name: CStyleCheck Tests

on:
  push:
    paths:
      - "src/cstylecheck/**"
      - "src/cstylecheck.py"
      - "src/rules.yml"
      - "src/_version.py"
      - "src/c_keywords.txt"
      - "src/c_stdlib_names.txt"
      - "src/c_spell_dict.txt"
      - "tests/**"
      - "tests/rules.yml"
      - "requirements.txt"
      - ".github/workflows/cstylecheck_tests.yml"
  pull_request:
    paths:
      - "src/cstylecheck/**"
      - "src/cstylecheck.py"
      - "src/rules.yml"
      - "src/_version.py"
      - "src/c_keywords.txt"
      - "src/c_stdlib_names.txt"
      - "src/c_spell_dict.txt"
      - "tests/**"
      - "tests/rules.yml"
      - "requirements.txt"
      - ".github/workflows/cstylecheck_tests.yml"

  workflow_dispatch:

jobs:
  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate _version.py
        working-directory: src
        run: |
          VERSION=$(git describe --tags --dirty --always 2>/dev/null || echo "0.0.0.dev")
          echo "__version__ = \"${VERSION}\"" > _version.py
          echo "Version: ${VERSION}"

      # -----------------------------------------------------------------------
      # YAML-004: Verify tests/rules.yml only differs from
      # src/rules.yml in the two documented test-fixture lines:
      #   - misc.indentation.style   (src: tabs | tests: spaces)
      #   - variables.allow_loop_vars_short  (src: true | tests: false)
      # Any other divergence fails the build.
      # -----------------------------------------------------------------------
      - name: Verify tests/ YAML divergence is intentional
        run: |
          DIFF=$(diff src/rules.yml tests/rules.yml \
                   | grep '^[<>]' \
                   | grep -v 'style: tabs\|style: spaces\|allow_loop_vars_short\|TEST FIXTURE\|intentionally' \
                   || true)
          if [ -n "$DIFF" ]; then
            echo "ERROR: tests/rules.yml has unexpected differences from src/:"
            echo "$DIFF"
            echo ""
            echo "Run: cp src/rules.yml tests/rules.yml"
            echo "then restore the two documented test-fixture overrides."
            exit 1
          fi
          echo "YAML diff check passed -- only permitted test-fixture differences found."

      # -----------------------------------------------------------------------
      # ASPICE SWE.4 BP7: subprocess coverage instrumentation (issue #54)
      #
      # sitecustomize.py is written to the workspace root so that any Python
      # child process with PYTHONPATH=. calls coverage.process_startup().
      # COVERAGE_PROCESS_START tells coverage which config to read (pyproject.toml).
      # This allows test_cli.py subprocess invocations to be instrumented,
      # closing the gap between the 86% statement-only baseline and the ≥90%
      # statement / ≥85% branch targets in CSC-SWE4-001 §4.2.
      #
      # Gate: ≥85% combined (statement + branch) — closes issue #54.
      # See: https://pytest-cov.readthedocs.io/en/latest/subprocess-support.html
      # -----------------------------------------------------------------------
      - name: Setup subprocess coverage instrumentation
        run: |
          printf 'try:\n    import coverage\n    coverage.process_startup()\nexcept ImportError:\n    pass\n' \
            > sitecustomize.py
          echo "PYTHONPATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "COVERAGE_PROCESS_START=$GITHUB_WORKSPACE/pyproject.toml" >> $GITHUB_ENV

      - name: Run all tests with coverage gate (statement + branch)
        run: |
          pytest tests/ \
            -v --tb=short \
            --cov=src --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-branch \
            --cov-fail-under=85

      # -----------------------------------------------------------------------
      # Static type check — catches import errors and inferred type mismatches.
      # --ignore-missing-imports suppresses third-party stub warnings; the
      # codebase is unannotated so --strict is deferred until annotations are
      # added (see issue #66). Only runs on one Python version to avoid noise.
      # -----------------------------------------------------------------------
      - name: Static type check
        if: matrix.python-version == '3.11'
        run: mypy src/cstylecheck/ --ignore-missing-imports --implicit-optional

      # -----------------------------------------------------------------------
      # Lint check — enforces code style and catches common errors via ruff.
      # -----------------------------------------------------------------------
      - name: Lint check
        if: matrix.python-version == '3.11'
        run: ruff check src/ tests/

      # -----------------------------------------------------------------------
      # Spell-check — catches typos in source code, docs, and YAML files.
      # False-positive words are suppressed in .codespellrc (issue #161).
      # Only runs on one Python version to avoid duplicate reports.
      # -----------------------------------------------------------------------
      - name: Spell check
        if: matrix.python-version == '3.11'
        run: |
          pip install codespell --quiet
          codespell

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

