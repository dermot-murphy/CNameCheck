# .github/workflows/cstylecheck_rules.yml
# =============================================================================
# Embedded C Style Compliance Checker with trend analysis
# =============================================================================
#
# Runs on every push and pull-request that touches C source or headers.
#
# On the default branch (main/master) it additionally:
#   1. Appends a JSON record to gh-pages/cstylecheck/trend.jsonl.
#   2. Regenerates gh-pages/cstylecheck/index.html (Chart.js trend graph).
#   3. Regenerates gh-pages/cstylecheck/badge.json (shields.io endpoint).
#   4. Updates the naming-convention badge line in README.md.
#
# Required repository settings
# -----------------------------
#   Settings -> Actions -> General -> Workflow permissions:
#     "Read and write permissions"
#
# The gh-pages branch is created automatically on the first trend run.
# Enable GitHub Pages (Settings -> Pages -> Source: gh-pages branch / root)
# to make the trend page publicly accessible.
# =============================================================================

name: CStyleCheck

on:
  push:
    paths:
      - "source/**/*.c"
      - "source/**/*.h"
      - "src/**"
      - ".github/workflows/cstylecheck_rules.yml"
  pull_request:
    paths:
      - "source/**/*.c"
      - "source/**/*.h"
      - "src/**"

  workflow_dispatch:

# Serialise runs on the same branch so concurrent pushes cannot race to
# append trend records, causing data loss or a non-fast-forward gh-pages push.
# The latest run wins; any in-progress run for the same ref is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Run the checker
  # ---------------------------------------------------------------------------
  stylecheck:
    name: Example C file action
    runs-on: ubuntu-latest

    outputs:
      errors:   ${{ steps.parse.outputs.errors }}
      warnings: ${{ steps.parse.outputs.warnings }}
      infos:    ${{ steps.parse.outputs.infos }}
      files:    ${{ steps.parse.outputs.files }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # On PRs, only the changed files are checked for speed
      - name: Get changed C files (PR only)
        if: github.event_name == 'pull_request'
        id: changed
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            source/**/*.c
            source/**/*.h

      # PR run
      - name: Run checker (pull request)
        if: >
          github.event_name == 'pull_request' &&
          steps.changed.outputs.any_changed == 'true'
        run: |
          mkdir -p output/cstylecheck
          python src/cstylecheck.py          \
            --config     src/rules.yml \
            --aliases    src/aliases.txt            \
            --exclusions src/exclusions.yml         \
            --github-actions                                   \
            --summary                                          \
            --log        output/cstylecheck/cstylecheck_results.txt \
            --exclude    source/cots/                          \
            ${{ steps.changed.outputs.all_changed_files }}
          CSC_EXIT=$?
          if [ $CSC_EXIT -eq 2 ]; then
            echo "::error::CStyleCheck configuration error (exit 2) — check rules.yml and supplementary config files."
            exit 2
          fi

      # Push / manual run -- all files
      - name: Run checker (push, all source)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p output/cstylecheck
          python src/cstylecheck.py          \
            --config     src/rules.yml \
            --aliases    src/aliases.txt            \
            --exclusions src/exclusions.yml         \
            --github-actions                                   \
            --summary                                          \
            --log        output/cstylecheck/cstylecheck_results.txt \
            --exclude    source/cots/                          \
            --include    "source/**/*.c"                       \
            --include    "source/**/*.h"
          CSC_EXIT=$?
          if [ $CSC_EXIT -eq 2 ]; then
            echo "::error::CStyleCheck configuration error (exit 2) — check rules.yml and supplementary config files."
            exit 2
          fi

      - name: Parse summary numbers
        id: parse
        if: always()
        shell: python
        run: |
          import re, os, pathlib

          log = pathlib.Path("output/cstylecheck/cstylecheck_results.txt")
          text = log.read_text() if log.exists() else ""

          def extract(pattern):
              m = re.search(pattern, text)
              return m.group(1) if m else "0"

          errors   = extract(r"Errors\s+:\s+(\d+)")
          warnings = extract(r"Warnings\s+:\s+(\d+)")
          infos    = extract(r"Info\s+:\s+(\d+)")
          files    = extract(r"Files checked\s+:\s+(\d+)")

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"errors={errors}\n")
              fh.write(f"warnings={warnings}\n")
              fh.write(f"infos={infos}\n")
              fh.write(f"files={files}\n")

          print(f"Errors={errors} Warnings={warnings} Info={infos} Files={files}")

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stylecheck-results-${{ github.run_number }}
          path: output/cstylecheck/cstylecheck_results.txt
          retention-days: 90

      - name: Fail job on naming errors
        if: steps.parse.outputs.errors != '0'
        run: |
          echo "::error::Naming convention: ${{ steps.parse.outputs.errors }} error(s) found."
          exit 1

  # ---------------------------------------------------------------------------
  # Job 2: Update trend data and README badge (default branch push only)
  # ---------------------------------------------------------------------------
  trend:
    name: Update Trend
    needs: stylecheck
    if: >
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repo (for README)
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Checkout or create gh-pages branch
        run: |
          if git ls-remote --exit-code --heads origin gh-pages; then
            git fetch origin gh-pages
            git checkout gh-pages
            git checkout ${{ github.sha }} -- .github 2>/dev/null || true
            git checkout ${{ github.sha }} -- README.md 2>/dev/null || true
            git checkout ${{ github.sha }} -- scripts/ 2>/dev/null || true
          else
            git checkout --orphan gh-pages
            git rm -rf . 2>/dev/null || true
          fi
          mkdir -p cstylecheck

      - name: Append trend record
        run: python scripts/ci/append_trend_record.py
        env:
          RUN_NUMBER: ${{ github.run_number }}
          SHA:        ${{ github.sha }}
          ERRORS:     ${{ needs.stylecheck.outputs.errors }}
          WARNINGS:   ${{ needs.stylecheck.outputs.warnings }}
          INFOS:      ${{ needs.stylecheck.outputs.infos }}
          FILES:      ${{ needs.stylecheck.outputs.files }}

      - name: Generate trend HTML page and badge JSON
        run: python scripts/ci/generate_trend.py
        env:
          ERRORS:   ${{ needs.stylecheck.outputs.errors }}
          WARNINGS: ${{ needs.stylecheck.outputs.warnings }}
          INFOS:    ${{ needs.stylecheck.outputs.infos }}
          FILES:    ${{ needs.stylecheck.outputs.files }}
          REPO:     ${{ github.repository }}

      - name: Commit and push trend data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cstylecheck/
          git diff --staged --quiet && echo "No change" && exit 0
          git commit -m \
            "trend: run #${{ github.run_number }} E=${{ needs.stylecheck.outputs.errors }} W=${{ needs.stylecheck.outputs.warnings }}"
          git push origin gh-pages

      - name: Update README badge and push to source branch
        run: |
          # -----------------------------------------------------------------------
          # HEAD is on gh-pages here. Branch-switching back to main in the same
          # working tree is unreliable when gh-pages is an orphan (no shared
          # ancestor). Instead, add a git worktree at /tmp/main-wt pointing at
          # the latest remote tip of the source branch. This gives us a fully
          # independent working directory for main without touching gh-pages HEAD.
          # -----------------------------------------------------------------------
          git fetch origin ${{ github.ref_name }}
          git worktree add /tmp/main-wt origin/${{ github.ref_name }}

          python scripts/ci/update_readme_badge.py /tmp/main-wt

          cd /tmp/main-wt
          git add README.md
          if git diff --staged --quiet; then
            echo "No README change — nothing to push"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "ci: update naming convention badge [skip ci]"
            # Push the worktree's branch (main) directly — HEAD never touched gh-pages.
            git push origin HEAD:${{ github.ref_name }}
          fi

          cd -
          git worktree remove /tmp/main-wt
        env:
          REPO: ${{ github.repository }}
